name: Build Mod Menu
on: [push, workflow_dispatch]
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- name: Entpacken und Bauen
run: |
unzip -q Android-Mod-Menu-main.zip
cd $(dirname $(find . -name "build.gradle" | head -n 1))/..
gradle wrapper --gradle-version 8.4 || true
chmod +x gradlew || true
./gradlew assembleDebug
- name: Fertige APK speichern
uses: actions/upload-artifact@v4
with:
name: DeadTriggerMod-APK
path: "**/app-debug.apk"
