name: Build
on: [push, workflow_dispatch]
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: gradle/actions/setup-gradle@v3
with:
gradle-version: 8.4 - run: unzip -q Android-Mod-Menu-main.zip && cd $(dirname $(find . -name "build.gradle" | head -n 1))/.. && gradle assembleDebug
-uses: actions/upload-artifact@v4
with:
name: DeadTriggerMod-APK
path: "**/app-debug.apk"
